name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: false
      - name: Install Python 3.12.16
        run: uv python install 3.12.16
      - name: Record baseline and prepare cold cache
        run: |
          uv --version
          uname -srm
          cat /etc/os-release
          test ! -d .venv
          baseline_cache=$(mktemp -d "$RUNNER_TEMP/diatonic-locked-cache.XXXXXX")
          echo "UV_CACHE_DIR=$baseline_cache" >> "$GITHUB_ENV"
          sha256sum uv.lock > "$RUNNER_TEMP/diatonic-lock.sha256"
      - name: Cold locked dependency sync
        run: |
          uv sync --locked --group dev --python 3.12.16
          sha256sum --check "$RUNNER_TEMP/diatonic-lock.sha256"
      - name: Warm locked sync and lock stability
        run: |
          uv sync --locked --group dev --python 3.12.16
          sha256sum --check "$RUNNER_TEMP/diatonic-lock.sha256"
          uv run --locked --python 3.12.16 python --version
      - name: Mypy
        run: uv run --locked --python 3.12.16 mypy src/diatonic
      - name: Ruff
        run: uv run --locked --python 3.12.16 ruff check .
      - name: Pytest
        run: uv run --locked --python 3.12.16 pytest -q
      - name: Lock rejection and installed distribution checks
        run: uv run --locked --python 3.12.16 python .github/scripts/verify_locked_baseline.py
      - name: Verify tracked lock is unchanged
        run: |
          sha256sum --check "$RUNNER_TEMP/diatonic-lock.sha256"
          git diff --exit-code -- uv.lock
