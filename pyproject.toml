[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "diatonic-orchestrator"
version = "0.1.0"
description = "Provider-agnostic Infrastructure as Code Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "TechTradeExpress" }]
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
]

[project.scripts]
diatonic = "diatonic.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "ruff>=0.8,<1",
    "mypy>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diatonic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
